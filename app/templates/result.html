<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ app_name }}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0b1020; color: #e8eefc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(92vw, 520px); padding: 34px 30px; border-radius: 18px;
      background: rgba(22, 30, 54, .92); border: 1px solid rgba(120, 150, 255, .18);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .45); text-align: center;
    }
    .badge {
      display: inline-block; margin-bottom: 14px; padding: 6px 12px; border-radius: 999px;
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    }
    .badge.approved { background: rgba(70, 200, 130, .16); color: #7ee2a8; }
    .badge.denied { background: rgba(255, 120, 120, .14); color: #ff9a9a; }
    .badge.expired, .badge.failed { background: rgba(255, 200, 90, .14); color: #ffd479; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { line-height: 1.7; margin: 10px 0; color: #c6d2ee; }
    .email { color: #fff; word-break: break-all; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge {{ status }}">{{ status }}</span>
    <h1>{{ message }}</h1>
    {% if email %}<p class="email">{{ email }}</p>{% endif %}
    <p class="meta">你现在可以关闭此页面。</p>
  </main>
</body>
</html>
