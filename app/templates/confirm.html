<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ app_name }}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0b1020; color: #e8eefc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(92vw, 520px); padding: 34px 30px; border-radius: 18px;
      background: rgba(22, 30, 54, .92); border: 1px solid rgba(120, 150, 255, .18);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    }
    h1 { margin: 0 0 14px; font-size: 22px; }
    p { line-height: 1.7; margin: 10px 0; color: #c6d2ee; }
    strong { color: #fff; word-break: break-all; }
    .meta { font-size: 13px; color: #8fa2d8; }
    .actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    button {
      flex: 1 1 180px; padding: 12px 16px; border-radius: 10px; border: 0; cursor: pointer;
      font-size: 15px; font-weight: 600;
    }
    .approve { background: #4f7cff; color: #fff; }
    .deny { background: transparent; color: #ff9a9a; border: 1px solid rgba(255, 120, 120, .5); }
    .hint { margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(120, 150, 255, .14);
            font-size: 12px; color: #7d8bb5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>{{ title }}</h1>
    <p>请确认 <strong>{{ email }}</strong> 是你在 {{ app_name }} 使用的邮箱。</p>
    <p class="meta">用途：{{ purpose_label }} · 链接有效期至 {{ expires_at }}（UTC）</p>
    <form method="post">
      <input type="hidden" name="token" value="{{ token }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="actions">
        <button class="approve" type="submit" name="decision" value="approve">确认这是我的邮箱</button>
        <button class="deny" type="submit" name="decision" value="deny">不是我的，拒绝</button>
      </div>
    </form>
    <p class="hint">如果这不是你发起的操作，请直接关闭本页，不要点击按钮。</p>
  </main>
</body>
</html>
