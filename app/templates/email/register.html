<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:24px;background:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif;color:#1d2433;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;padding:32px 28px;border:1px solid #e3e8f4;">
    <h2 style="margin:0 0 16px;font-size:20px;">完成 {{ app_name }} 注册</h2>
    <p style="line-height:1.7;margin:0 0 10px;">你正在注册 {{ app_name }} 账号，请确认 <strong>{{ email }}</strong> 是你的邮箱。</p>
    <p style="line-height:1.7;margin:0 0 22px;color:#5b6580;">链接 {{ expires_minutes }} 分钟内有效。</p>
    <p style="margin:0 0 22px;">
      <a href="{{ link }}" style="display:inline-block;padding:12px 20px;border-radius:9px;background:#4f7cff;color:#ffffff;text-decoration:none;font-weight:600;">完成邮箱确认</a>
    </p>
    <p style="line-height:1.6;margin:0 0 6px;color:#7a849c;font-size:12px;">如果按钮无法打开，请复制以下链接到浏览器：</p>
    <p style="line-height:1.6;margin:0 0 22px;color:#7a849c;font-size:12px;word-break:break-all;">{{ link }}</p>
    <hr style="border:0;border-top:1px solid #edf0f7;margin:22px 0;">
    <p style="line-height:1.6;margin:0;color:#8b94a9;font-size:12px;">如果这不是你发起的操作，请忽略本邮件，不要点击上面的链接。</p>
  </div>
</body>
</html>
