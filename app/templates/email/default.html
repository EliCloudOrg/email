<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:24px;background:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif;color:#1d2433;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;padding:32px 28px;border:1px solid #e3e8f4;">
    <h2 style="margin:0 0 16px;font-size:20px;">{{ app_name }} 邮箱确认</h2>
    <p style="line-height:1.7;margin:0 0 10px;">请确认 <strong>{{ email }}</strong> 是你在 {{ app_name }} 使用的邮箱。</p>
    <p style="line-height:1.7;margin:0 0 22px;color:#5b6580;">用途：{{ purpose_label }} · 请在 {{ expires_minutes }} 分钟内点击下方按钮确认；超时未确认将视为拒绝。</p>
    <p style="margin:0 0 22px;">
      <a href="{{ link }}" style="display:inline-block;padding:12px 20px;border-radius:9px;background:#4f7cff;color:#ffffff;text-decoration:none;font-weight:600;">确认邮箱</a>
    </p>
    <hr style="border:0;border-top:1px solid #edf0f7;margin:22px 0;">
    <p style="line-height:1.6;margin:0;color:#8b94a9;font-size:12px;">如果这不是你发起的操作，请忽略本邮件，不要点击按钮。</p>
  </div>
</body>
</html>
