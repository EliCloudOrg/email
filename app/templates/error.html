<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ app_name }}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0b1020; color: #e8eefc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(92vw, 520px); padding: 32px 28px; border-radius: 18px;
      background: rgba(22, 30, 54, .92); border: 1px solid rgba(120, 150, 255, .18);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    }
    h1 { margin: 0 0 12px; font-size: 21px; }
    p { line-height: 1.7; margin: 0; color: #c6d2ee; }
  </style>
</head>
<body>
  <main class="card">
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
  </main>
</body>
</html>
